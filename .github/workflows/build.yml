name: Build DiyahQA Hub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build React
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Package Electron (macOS)
        run: npx electron-builder --mac --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiyahQA-Hub-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build React
        run: npm run build
        env:
          CI: false
          GENERATE_SOURCEMAP: false

      - name: Package Electron (Windows)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DiyahQA-Hub-Windows
          path: |
            dist/*.exe
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: DiyahQA-Hub-macOS
          path: artifacts/mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: DiyahQA-Hub-Windows
          path: artifacts/win

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: DiyahQA Hub ${{ github.ref_name }}
          body: |
            ## DiyahQA Hub ${{ github.ref_name }}

            ### 📥 Download
            - **macOS** (Apple Silicon): `DiyahQA Hub-*-arm64.dmg`
            - **Windows** (x64): `DiyahQA Hub Setup *.exe` atau `DiyahQA Hub *.exe` (portable)

            ### Instalasi
            **macOS:** Buka `.dmg` → drag ke Applications → klik kanan Open
            **Windows:** Jalankan `.exe` installer, atau gunakan versi portable
          files: |
            artifacts/mac/*.dmg
            artifacts/mac/*.zip
            artifacts/win/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
